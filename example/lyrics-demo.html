<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetterLyrics 效果合集 · 沧海一声笑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============ 统一主题配置（集中修改这里）============ */
  :root{ --theme-bg:#000000; --theme-text:#00e676; }  /* 背景=黑色  文字=绿色 */

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--theme-bg);color:var(--theme-text);
    font-family:'Noto Serif SC','Source Han Serif CN',serif;
    overflow:hidden;user-select:none;
    display:flex;flex-direction:column;
  }
  /* 内置歌词文字统一绿色（!important 覆盖各效果内联色，距离淡出仍靠 opacity） */
  #track .line, #track .line *{
    color:var(--theme-text) !important;
    -webkit-text-fill-color:var(--theme-text) !important;
  }
  #topbar{
    flex-shrink:0;display:flex;align-items:center;gap:16px;
    padding:12px 20px;background:rgba(255,255,255,0.03);
    border-bottom:1px solid rgba(255,255,255,0.07);z-index:30;flex-wrap:wrap;
  }
  #title{font-size:17px;font-weight:700;letter-spacing:.12em;opacity:.92;white-space:nowrap;}
  select{
    background:#1b1b20;color:#fff;border:1px solid rgba(255,255,255,0.2);
    border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;cursor:pointer;outline:none;max-width:46vw;
  }
  select:hover{border-color:rgba(255,255,255,0.4);}
  optgroup{color:#9aa;font-style:normal;}
  option{color:#fff;background:#1b1b20;}
  audio{height:34px;}
  #srclabel{
    margin-left:auto;text-align:right;font-size:11px;line-height:1.5;
    opacity:.5;font-family:'Courier New',monospace;white-space:nowrap;
  }
  #stage{position:relative;flex:1;overflow:hidden;}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;}
  #track{position:absolute;left:0;right:0;top:0;z-index:10;will-change:transform;transform-origin:center center;}
  #visual-host{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;}
  #visual-host.active{display:flex;}
  .line{
    position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;
    flex-wrap:wrap;text-align:center;line-height:1.3;font-size:30px;
    transform-origin:center center;will-change:transform,opacity,filter;
    padding:0 6%;
  }
  .ch{display:inline-block;white-space:pre;will-change:transform;}
  #hint{
    flex-shrink:0;padding:8px 20px;font-size:11px;opacity:.4;text-align:center;
    font-family:'Courier New',monospace;border-top:1px solid rgba(255,255,255,0.06);
  }
</style>
</head>
<body>

<div id="topbar">
  <span id="title">沧海一声笑</span>
  <select id="picker"><option>加载特效中…</option></select>
  <audio id="player" controls loop src="demo-ly.mp3"></audio>
  <span id="srclabel"></span>
</div>

<div id="stage">
  <canvas id="bg"></canvas>
  <div id="track"></div>
  <div id="visual-host"></div>
</div>

<div id="hint">▶ 播放 demo-ly.mp3 驱动歌词 · 拖动进度条可定位 · 从下拉框切换效果（内置效果与 CodePen 特效均为 effect/ 下独立模块）</div>

<script>
/* ============================ 歌词数据 ============================ */
const lyrics = [
  { t: 10560, text: "沧海一声笑" },{ t: 13800, text: "滔滔两岸潮" },{ t: 17740, text: "浮沉随浪" },
  { t: 22160, text: "只记今朝" },{ t: 25240, text: "苍天笑" },{ t: 28340, text: "纷纷世上潮" },
  { t: 32500, text: "谁负谁胜出天知晓" },{ t: 40080, text: "江山笑 烟雨遥" },
  { t: 47320, text: "涛浪淘尽 红尘俗世几多娇" },{ t: 54520, text: "清风笑 竟惹寂寥 豪情还剩了一襟晚照" },
  { t: 92660, text: "苍生笑 不再寂寥" },{ t: 99660, text: "豪情仍在痴痴笑笑" },
  { t: 122660, text: "啦啦啦啦啦" },{ t: 153660, text: "啦啦啦啦啦" },
];
const SONG_END = 175000;
const lineInfo = lyrics.map((l, i) => {
  const end = i + 1 < lyrics.length ? lyrics[i + 1].t : SONG_END;
  const chars = [...l.text];
  const dur = end - l.t;
  const charDur = dur / chars.length;
  const charTimes = chars.map((ch, k) => ({ ch, start: l.t + k * charDur, dur: charDur }));
  return { start: l.t, end, dur, chars, charDur, charTimes };
});

/* ============================ 常量 / 工具 ============================ */
const DEFAULT_SCALE = 0.75, LONG_SYLLABLE = 700, FLOAT_PX = 18, FLOAT_DUR = 450, GAP = 64;
const easeOutSine = x => Math.sin(Math.min(Math.max(x,0),1) * Math.PI / 2);
const clamp = (v,a,b) => Math.min(Math.max(v,a),b);
const lerp = (a,b,t) => a + (b - a) * t;

/* ============================ 模块注册表 ============================
   每个 effect/*.js 调用 BL.register({...}) 注册一个效果：
   { id, name, kind:'text'|'bg'|'visual', group, order, src,
     // text:   frame?(api)->trackExtraStr   line(api, L, ln)->{scale,opacity,rotate,origin}?
     // bg:     init(api)->state             draw(api, state)
     // visual: css, html, letterTpl? }
============================================================================ */
const BL = {
  effects: {},
  list: [],
  current: null,
  register(e){ if(!e||!e.id) return; this.effects[e.id]=e; this.list.push(e); },
};
window.BL = BL;

/* ============================ DOM ============================ */
const track = document.getElementById('track');
const stage = document.getElementById('stage');
const player = document.getElementById('player');
const picker = document.getElementById('picker');
const srclabel = document.getElementById('srclabel');
const visualHost = document.getElementById('visual-host');
const bgCanvas = document.getElementById('bg');
const bx = bgCanvas.getContext('2d');

const lineEls = [];
function buildDOM(){
  track.innerHTML = '';
  lineInfo.forEach((info, i) => {
    const el = document.createElement('div');
    el.className = 'line';
    el.style.top = (i * GAP) + 'px';
    el.style.height = GAP + 'px';
    const chEls = [];
    info.chars.forEach(ch => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = ch === ' ' ? '  ' : ch;
      el.appendChild(s); chEls.push(s);
    });
    track.appendChild(el);
    lineEls.push({ el, chEls });
  });
}
buildDOM();

let BW=0, BH=0;
function resize(){ BW = stage.clientWidth; BH = stage.clientHeight; bgCanvas.width = BW; bgCanvas.height = BH; }
window.addEventListener('resize', resize);

/* ============================ 时钟（音频主） ============================ */
function nowMs(){ const t = player.currentTime; return isNaN(t) ? 0 : t * 1000; }
function curIndex(ms){ let idx=-1; for(let i=0;i<lyrics.length;i++){ if(ms>=lyrics[i].t) idx=i; else break; } return idx; }

/* ============================ 共享辅助 ============================ */
function resetLineStyles(L){
  L.el.style.filter='none'; L.el.style.transformOrigin='center center'; L.el.style.textShadow='none';
  L.chEls.forEach(s=>{ s.style.transform=''; s.style.textShadow=''; s.style.background=''; s.style.webkitTextFillColor=''; s.style.color=''; });
}
function setLineColor(L, isCur, df){
  L.el.style.color = isCur ? '#fff' : `rgba(255,255,255,${(0.4*(1-df*0.7)).toFixed(3)})`;
  L.el.style.fontWeight = isCur ? '700' : '400';
}
function charPlayedColor(L, info, ms){
  L.chEls.forEach((s,i)=>{ const ct=info.charTimes[i]; const p=clamp((ms-ct.start)/ct.dur,0,1); s.style.color = p>0?'#fff':'rgba(255,255,255,0.4)'; });
}

/* ============================ Visual（Shadow DOM） ============================ */
let visualShadow=null, lastVisualLine=null, visualWrap=null, visualCharTimes=null;
function buildTpl(entry, line){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const chars=[...line], safe=esc(line)||'&nbsp;';
  let letters;
  if(entry.letterTpl){
    letters = chars.map((ch,i)=> entry.letterTpl.replace(/\{i\}/g,i).replace(/\{n\}/g,chars.length).replace(/\{ch\}/g, ch===' '?'&nbsp;':esc(ch))).join('')||'&nbsp;';
  } else {
    letters = chars.map((ch,i)=>`<span class="bl-l" style="--i:${i};--n:${chars.length}">${ch===' '?'&nbsp;':esc(ch)}</span>`).join('')||'&nbsp;';
  }
  return (entry.html||'<div class="bl-line">{{LINE}}</div>').replace(/\{\{LETTERS\}\}/g,letters).replace(/\{\{LINE\}\}/g,safe);
}
// visual 系列统一覆盖：黑底、绿字、字号=clamp(同放大)、逐字(左→右遮罩)出现
const VISUAL_OVERRIDE = `
  :host{ background:var(--theme-bg) !important; }
  .bl-wrap, .bl-wrap *{ background:transparent !important; }
  .bl-wrap,.bl-wrap *{
    color:var(--theme-text) !important; -webkit-text-fill-color:var(--theme-text) !important;
    font-size:clamp(34px, 5vw, 88px) !important; white-space:nowrap !important;
  }
  .bl-wrap{
    width:max-content !important; max-width:94% !important; margin:0 auto !important;
    line-height:1.3 !important;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(var(--reveal,1)*100% - 0.4ch), transparent calc(var(--reveal,1)*100% + 0.1ch));
            mask-image:linear-gradient(90deg,#000 calc(var(--reveal,1)*100% - 0.4ch), transparent calc(var(--reveal,1)*100% + 0.1ch));
  }`;
function renderVisual(ms, e){
  const cur=curIndex(ms); const line=cur<0?'':lyrics[cur].text;
  if(line!==lastVisualLine){
    lastVisualLine=line;
    visualShadow.innerHTML =
      `<style>:host{display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden;}
        .bl-wrap{max-width:94%;text-align:center;line-height:1.2;} ${e.css||''}
        ${VISUAL_OVERRIDE}</style><div class="bl-wrap">${buildTpl(e,line)}</div>`;
    visualWrap = visualShadow.querySelector('.bl-wrap');
    visualCharTimes = cur<0 ? null : lineInfo[cur].charTimes;
  }
  // 逐字揭示：揭示已到时间的字符数 / 总字符数
  if(visualWrap){
    let reveal=1;
    if(visualCharTimes && visualCharTimes.length){
      let n=0; for(const ct of visualCharTimes){ if(ms>=ct.start) n++; else break; }
      reveal = n/visualCharTimes.length;
    }
    visualWrap.style.setProperty('--reveal', reveal);
  }
}


/* ============================ 渲染上下文 ============================ */
function makeApi(ms, cur){
  return {
    ms, cur, BW, BH, stage, track, g: bx, player,
    lyrics, lineInfo, lineEls,
    GAP, HALF: 3*GAP, DEFAULT_SCALE, LONG_SYLLABLE, FLOAT_PX, FLOAT_DUR,
    clamp, lerp, easeOutSine, charPlayedColor,
  };
}

/* ============================ 主循环 ============================ */
let scrollY=0, scrollInit=false, bgState=null;
function frame(){
  const ms = nowMs();
  const eff = BL.current;
  stage.style.perspective='none'; stage.style.maskImage='none'; stage.style.webkitMaskImage='none';
  if(!eff){ requestAnimationFrame(frame); return; }

  if(eff.kind==='visual'){ bx.clearRect(0,0,BW,BH); if(visualShadow) renderVisual(ms,eff); requestAnimationFrame(frame); return; }

  const cur = curIndex(ms);
  const curForScroll = cur<0?0:cur;
  const centerY = BH/2;
  const targetScroll = centerY - (curForScroll*GAP + GAP/2);
  if(!scrollInit){ scrollY=targetScroll; scrollInit=true; } else scrollY = lerp(scrollY, targetScroll, 0.12);

  const api = makeApi(ms, cur);

  if(eff.kind==='bg'){ if(eff.draw) eff.draw(api, bgState); }
  else bx.clearRect(0,0,BW,BH);

  let trackTransform = `translateY(${scrollY}px)`;
  if(eff.kind==='text' && eff.frame){ const extra = eff.frame(api); if(extra) trackTransform += ' ' + extra; }
  track.style.transform = trackTransform;

  const HALF = 3*GAP;
  for(let i=0;i<lineEls.length;i++){
    const L=lineEls[i], info=lineInfo[i];
    const isCur=(i===cur), d=i-curForScroll, df=clamp(Math.abs(d)*GAP/HALF,0,1);
    if(Math.abs(d)>6){ L.el.style.opacity='0'; continue; }
    resetLineStyles(L); setLineColor(L, isCur, df);
    let base = { scale: isCur?1.0:(1.0-df*(1.0-DEFAULT_SCALE)), opacity: isCur?1.0:clamp(1-df,0.06,1), rotate:0, origin:'center center' };
    if(eff.kind==='text' && eff.line){ const o=eff.line(api, L, {i,isCur,d,df,info,ms}); if(o) Object.assign(base,o); }
    L.el.style.transformOrigin = base.origin;
    L.el.style.opacity = base.opacity.toFixed(3);
    L.el.style.transform = `scale(${base.scale.toFixed(3)})` + (base.rotate?` rotate(${base.rotate.toFixed(2)}deg)`:'');
  }
  requestAnimationFrame(frame);
}

/* ============================ 切换 ============================ */
function applyMode(id){
  const eff = BL.effects[id];
  BL.current = eff || null;
  const isVisual = eff && eff.kind==='visual';
  visualHost.classList.toggle('active', !!isVisual);
  track.style.display = isVisual ? 'none' : '';
  bgState = null;
  if(eff){
    if(isVisual){ if(!visualShadow) visualShadow = visualHost.attachShadow({mode:'open'}); lastVisualLine=null; }
    else if(eff.kind==='bg' && eff.init){ bgState = eff.init(makeApi(0,0)); }
    srclabel.textContent = eff.src || '';
  }
  stage.style.perspective='none'; stage.style.maskImage='none';
}
picker.addEventListener('change', e => applyMode(e.target.value));

/* ============================ 下拉框 ============================ */
const GROUP_ORDER = ['歌词文字效果','背景效果','Visual 数据集特效'];
function buildPicker(){
  BL.list.sort((a,b)=> (GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group)) || ((a.order||9999)-(b.order||9999)) || a.name.localeCompare(b.name));
  picker.innerHTML='';
  const groups={};
  BL.list.forEach(e=>{
    const gname = GROUP_ORDER.includes(e.group)?e.group:'其他';
    if(!groups[gname]){ const og=document.createElement('optgroup'); og.label=gname; picker.appendChild(og); groups[gname]=og; }
    const o=document.createElement('option'); o.value=e.id; o.textContent=e.name; groups[gname].appendChild(o);
  });
  // 分组数量后缀
  Array.from(picker.querySelectorAll('optgroup')).forEach(og=>{ og.label += ` (${og.children.length})`; });
}

/* ============================ 模块加载器 ============================ */
function loadModules(files, done){
  let remaining = files.length;
  if(!remaining){ done(); return; }
  files.forEach(fn=>{
    const s=document.createElement('script');
    s.src='effect/'+fn;
    s.onload=s.onerror=()=>{ if(--remaining===0) done(); };
    document.head.appendChild(s);
  });
}
function boot(){
  const files = window.BL_MANIFEST || [];
  loadModules(files, ()=>{
    buildPicker();
    resize();
    const first = BL.list[0];
    if(first){ picker.value=first.id; applyMode(first.id); }
    requestAnimationFrame(frame);
  });
}
</script>
<script src="effect/manifest.js" onload="boot()" onerror="boot()"></script>
</body>
</html>
