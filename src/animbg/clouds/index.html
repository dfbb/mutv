<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vanta.js Clouds</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        cursor: none;
        background: #07080d;
        color: #f5f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #vanta {
        position: fixed;
        inset: 0;
        cursor: none;
      }

      canvas {
        cursor: none !important;
      }

    </style>
    <script src="../vendor/three.r134.min.js"></script>
    <script src="../vendor/p5.min.js"></script>
    <script src="../vendor/vanta/dist/vanta.clouds.min.js"></script>
  </head>
  <body>
    <div id="vanta"></div>
    <script>
      VANTA.CLOUDS({
        el: "#vanta",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        skyColor: 0x78c6df,
        cloudColor: 0xc9d8f2,
        cloudShadowColor: 0x1b3354,
        sunColor: 0xffa24c,
        sunGlareColor: 0xff6633,
        sunlightColor: 0xffb06a,
        speed: 0.8,
        scale: 3
      });
    </script>
  </body>
</html>
