<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vanta.js Ripple</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f8f9fa;
        color: #151515;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #vanta {
        position: fixed;
        inset: 0;
      }

    </style>
    <script src="../vendor/three.r134.min.js"></script>
    <script src="../vendor/p5.min.js"></script>
    <script src="../vendor/vanta/dist/vanta.ripple.min.js"></script>
  </head>
  <body>
    <div id="vanta"></div>
    <script>
      VANTA.RIPPLE({
        el: "#vanta",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        color1: 0x0d6efd,
        color2: 0xffffff,
        backgroundColor: 0xf8f9fa,
        amplitudeFactor: 1.1,
        ringFactor: 4,
        rotationFactor: 0.12,
        speed: 0.9
      });
    </script>
  </body>
</html>
