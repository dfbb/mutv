<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vanta.js Birds</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07080d;
        color: #f5f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #vanta {
        position: fixed;
        inset: 0;
      }

    </style>
    <script src="../vendor/three.r134.min.js"></script>
    <script src="../vendor/p5.min.js"></script>
    <script src="../vendor/vanta/dist/vanta.birds.min.js"></script>
  </head>
  <body>
    <div id="vanta"></div>
    <script>
      VANTA.BIRDS({
        el: "#vanta",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        backgroundColor: 0x07192f,
        color1: 0xff4d6d,
        color2: 0x46e0ff,
        colorMode: "varianceGradient",
        birdSize: 1.1,
        wingSpan: 28,
        speedLimit: 4.2,
        separation: 26,
        alignment: 22,
        cohesion: 18,
        quantity: 4
      });
    </script>
  </body>
</html>
