<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vanta.js Cells</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07080d;
        color: #f5f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #vanta {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 25% 25%, rgba(0, 184, 169, 0.34), transparent 34%),
          radial-gradient(circle at 74% 62%, rgba(255, 222, 89, 0.28), transparent 38%),
          #101820;
      }

    </style>
    <script src="../vendor/three.r134.min.js"></script>
    <script src="../vendor/vanta/dist/vanta.cells.min.js"></script>
  </head>
  <body>
    <div id="vanta"></div>
    <script>
      VANTA.CELLS({
        el: "#vanta",
        THREE: window.THREE,
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        forceAnimate: true,
        minHeight: 200,
        minWidth: 200,
        color1: 0x00b8a9,
        color2: 0xffde59,
        backgroundColor: 0x101820,
        amplitudeFactor: 1,
        ringFactor: 1.25,
        rotationFactor: 0.65,
        size: 1.35,
        speed: 0.95
      });
    </script>
  </body>
</html>
